services:
  - type: web
    name: fieldfix-api
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci && npx prisma generate --schema backend/prisma/schema.prisma && npm --prefix backend run build
    preDeployCommand: npx prisma migrate deploy --schema backend/prisma/schema.prisma
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fieldfix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
  - type: web
    name: fieldfix-dashboard
    runtime: static
    buildCommand: npm ci && npm --prefix admin-dashboard run build
    staticPublishPath: admin-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fieldfix-api.onrender.com/api
databases:
  - name: fieldfix-db
    databaseName: fieldfix
    user: fieldfix
    plan: 0.5c-1g
    region: singapore
